<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="20" fill="url(#bg)"/>

  <!-- Cyber Grid Pattern -->
  <circle cx="200" cy="170" r="130" fill="none" stroke="#ff6b00" stroke-width="1" opacity="0.15" stroke-dasharray="6 6"/>
  <circle cx="200" cy="170" r="105" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
  <circle cx="200" cy="170" r="80" fill="none" stroke="#ff6b00" stroke-width="2" opacity="0.35"/>

  <!-- Hexagon Target Accent -->
  <polygon points="200,95 265,132 265,208 200,245 135,208 135,132" fill="#111111" stroke="#ff6b00" stroke-width="2" opacity="0.75"/>

  <!-- Initials -->
  <text x="200" y="178" text-anchor="middle" dominant-baseline="central" fill="#fafafa" font-family="monospace, sans-serif" font-size="44" font-weight="900" letter-spacing="2">
    IA
  </text>

  <!-- Callsign Tag -->
  <rect x="125" y="265" width="150" height="24" rx="6" fill="#1c1c1c" stroke="#ff6b00" stroke-width="1" opacity="0.9"/>
  <text x="200" y="278" text-anchor="middle" dominant-baseline="central" fill="#ff7a1a" font-family="monospace, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5">
    // MEDIA-01
  </text>

  <!-- Role Subtitle -->
  <text x="200" y="322" text-anchor="middle" fill="#d4d4d4" font-family="monospace, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">
    VIDEO LEAD
  </text>

  <!-- Border Frame Corners -->
  <rect x="10" y="10" width="380" height="380" rx="16" fill="none" stroke="#262626" stroke-width="1"/>
  <path d="M10,32 L10,10 L32,10" fill="none" stroke="#ff6b00" stroke-width="3"/>
  <path d="M390,32 L390,10 L368,10" fill="none" stroke="#ff6b00" stroke-width="3"/>
  <path d="M10,368 L10,390 L32,390" fill="none" stroke="#ff6b00" stroke-width="3"/>
  <path d="M390,368 L390,390 L368,390" fill="none" stroke="#ff6b00" stroke-width="3"/>
</svg>